:root {

.exhibit > header { margin-bottom: 20px; }

/* Project colors from the palette */
#dreamy { --c: var(--c-msblue); } #drinkdock { --c: var(--c-amethyst); } #fivek { --c: var(--c-carrot); } #in { --c: var(--c-jade); }
#wharton-os { --c: var(--c-honey); } #walldrobe { --c: var(--c-magenta); }
.project { border-top: 1px solid var(--rule); position: relative; }
/* (Oct 7) the short colored stripe over page titles is gone: it was decoration */
.holdings td.p .sw2 { display: inline-block; width: 10px; height: 10px; margin-right: 9px; background: var(--c); vertical-align: 0; }
.deep-link { border-color: var(--c, var(--ink)); }

/* Exhibit 1: the build log */
.log-wrap { display: grid; grid-template-columns: minmax(0, 21fr) minmax(0, 18fr); gap: 20px; }
@media (max-width: 859px) { .log-wrap { grid-template-columns: minmax(0, 1fr); gap: 14px; } }
.log { width: 100%; border-collapse: collapse; table-layout: fixed; }
.log th { font-weight: 500; font-size: 11.5px; color: var(--muted); padding: 0; white-space: nowrap; overflow: visible; }
.log thead th { text-align: left; height: 18px; vertical-align: bottom; }
.log thead th:first-child, .log tbody th { width: 30px; text-align: left; }
.log td { padding: 0; position: relative; }
.log td::before { content: ''; display: block; padding-top: 100%; }
.log td i { position: absolute; inset: 0; margin: auto; width: calc(var(--s, 0.4) * 100%); height: auto; aspect-ratio: 1; border-radius: 50%; }
.log tbody th { font-size: 11px; line-height: 1; }
.log-key { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13.5px; color: var(--ink-2); margin-bottom: 10px; }
.log-key i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

.d-dreamy { background: var(--c-msblue); } .d-in { background: var(--c-jade); } .d-5k { background: var(--c-carrot); }
.d-dd { background: var(--c-amethyst); } .d-wd { background: var(--c-magenta); } .d-other { background: var(--c-grey); } .d-ink { background: var(--ink-2); }

/* a ring around the day: honey for a race, ink for my first day at Wharton. A code dot, if any, sits inside it. */
.log td.mark::after { content: ''; position: absolute; inset: 0; margin: auto; width: 74%; aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--ring); box-sizing: border-box; pointer-events: none; }
.log td.race { --ring: var(--c-honey); } .log td.first { --ring: var(--ink); }
.log td.mark { cursor: help; }
.log-key i.ring { width: 12px; height: 12px; background: transparent; border: 2px solid var(--ring); box-sizing: border-box; }
.log-key i.race { --ring: var(--c-honey); } .log-key i.first { --ring: var(--ink); }
.log td i.chat, .log-key i.chat { width: 34%; border-radius: 1px; }
.log-key i.chat { width: 8px; height: 8px; }
.log-key.k2 { margin-top: -4px; color: var(--muted); }

/* skills */
:root { --k-msblue: #1B436D; --k-razz: #1F72D0; --k-jade: #23774F; --k-amethyst: #6450B8; --k-carrot: #B04A1C; --k-honey: #8A5E00; --k-magenta: #BF2C6E; --k-grey: #5B5A61; }
:root { --k-msblue: #8DB4E6; --k-razz: #4FA8FF; --k-jade: #5CC495; --k-amethyst: #A593EC; --k-carrot: #E8834F; --k-honey: #E8AE2E; --k-magenta: #E56A9C; --k-grey: #A3A5AE; }
.kcloud { position: relative; }
.kgroup { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; }
.kgroup li::before { content: none; }
.kw { appearance: none; background: none; border: 0; padding: 0; margin: 0; font: inherit; color: var(--k); cursor: pointer; line-height: 1; white-space: nowrap; letter-spacing: -0.01em; border-radius: 3px; }
.kw1 { font-size: 14px; font-weight: 500; } .kw2 { font-size: 17px; font-weight: 600; } .kw3 { font-size: 22px; font-weight: 700; }
.kw4 { font-size: 29px; font-weight: 800; letter-spacing: -0.02em; } .kw5 { font-size: 38px; font-weight: 900; letter-spacing: -0.025em; }
.kw[aria-pressed="true"] { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 0.16em; }
.kw:focus-visible { outline: 2px solid var(--k); outline-offset: 2px; }
.kcloud.placed .kgroup { display: contents; }
.kcloud.placed .kgroup li { display: contents; }
.kcloud.placed .kw { position: absolute; left: 0; top: 0; transform-origin: center; will-change: transform; }
.kcloud.placed { transition: opacity .25s; overflow: clip; overflow-clip-margin: 8px; }
.kcloud[data-filter] .kw { opacity: .16; }
.kcloud[data-filter="quant"] [data-cat="quant"], .kcloud[data-filter="eng"] [data-cat="eng"], .kcloud[data-filter="product"] [data-cat="product"],
.kcloud[data-filter="comm"] [data-cat="comm"], .kcloud[data-filter="lead"] [data-cat="lead"], .kcloud[data-filter="me"] [data-cat="me"] { opacity: 1; }
.kaxis { margin-top: 18px; }
.kchips { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.kchip { appearance: none; background: none; border: 0; border-top: 3px solid var(--k); padding: 7px 2px 4px; font: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink-2); text-align: left; cursor: pointer; min-height: 40px; line-height: 1.25; }
.kchip i { display: none; }
.kchip[aria-pressed="true"] { color: var(--k); }
.kchip:hover { color: var(--k); }
.kchip:focus-visible { outline: 2px solid var(--k); outline-offset: 2px; }
.kends { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin: 2px 0 0; }
.kdetail { margin-top: 18px; padding: 12px 0 14px; border-top: 1px solid var(--rule); min-height: 118px; }
.kdetail > * { max-width: 46em; }
.kdetail .kmeta { margin: 2px 0 6px; font-size: 13.5px; font-weight: 600; color: var(--k); }
.kdetail .kword { margin: 2px 0 4px; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.015em; line-height: 1.2; }
.kdetail .kproof { margin: 0; color: var(--ink-2); }
.skills .src { margin-top: 14px; }
.kview { display: none; justify-content: flex-end; margin: -8px 0 6px; }
.kswitch { appearance: none; background: none; font: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink); border: 1px solid var(--rule-strong); border-radius: 6px; padding: 8px 12px; min-height: 40px; cursor: pointer; }
.kswitch:hover { background: var(--ink); color: var(--paper); }
.kswitch:focus-visible { outline: 2px solid var(--olive); outline-offset: 2px; }
.skills.kjs .kview { display: flex; }
.skills:not(.kjs) .kcloudview { display: none; }
.skills.kjs .klist { display: none; }
.skills.kjs.klisting .klist { display: block; }
.skills.kjs.klisting .kcloudview { display: none; }
.klist { border-top: 1px solid var(--rule); }
.klg { display: grid; gap: 6px 40px; padding: 16px 0; border-bottom: 1px solid var(--rule); }
@media (min-width: 860px) { .klg { grid-template-columns: 3fr 9fr; } }
.klg h3 { margin: 0; font-size: 1rem; font-weight: 800; color: var(--k); display: flex; align-items: baseline; gap: 9px; }
.klg h3 i { width: 10px; height: 10px; background: var(--k); display: inline-block; flex: none; }
.klg dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 7px 20px; font-size: 15px; }
.klg dt { font-weight: 700; }
.klg dd { margin: 0; color: var(--ink-2); }
@media (max-width: 559px) { .klg dl { grid-template-columns: 1fr; gap: 2px; } .klg dd { margin-bottom: 8px; } }
@media (max-width: 699px) {
  .kchips { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 14px; }
  .kcloudview { display: flex; flex-direction: column; }
  .kaxis { order: -1; margin: 0 0 16px; }
  .kcloud { order: 0; }
  .kdetail { order: 1; }
  .kends { display: none; }
  .kw1 { font-size: 12.5px; } .kw2 { font-size: 14px; } .kw3 { font-size: 17px; } .kw4 { font-size: 21px; } .kw5 { font-size: 26px; }
  .kdetail { min-height: 0; }
  .kdetail .kword { font-size: 1.15rem; }
  .kdetail .kproof { font-size: 15px; line-height: 1.45; }
}
@media (pointer: coarse) { .kchip, .kswitch { min-height: 44px; } }
@media (prefers-reduced-motion: reduce) { .kcloud.placed { transition: none; } }
/* /skills */

/* See-it column and the demo link by the intro */
.holdings td.d.see { font-family: inherit; font-size: 14px; }
.cta { display: inline-flex; align-items: center; min-height: 40px; padding: 8px 14px; border-radius: 6px; background: var(--olive); color: var(--paper); font-weight: 700; font-size: 14.5px; text-decoration: none; }
.cta:hover { color: var(--paper); text-decoration: underline; }
.cta:focus-visible { outline: 2px solid var(--olive); outline-offset: 3px; }
@media (pointer: coarse) { .cta { min-height: 44px; } }

.cta-row { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 10px; }
.cta.cta-2 { background: none; color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule-strong); }
.cta.cta-2:hover { color: var(--ink); }
/* the one line under my name (Oct 7, from a friend's review) */
.tagline { margin: 14px 0 0; max-width: 30em; font-size: clamp(1.2rem, 2.3vw, 1.6rem); font-weight: 700; line-height: 1.3; letter-spacing: -0.015em; color: var(--ink); }
.cta-row + .contact-line { margin-top: 12px; }

.work-note { max-width: 40em; margin: 10px 0 0; color: var(--ink-2); line-height: 1.55; }

.work-intro { max-width: 40em; margin: 0 0 22px; color: var(--ink-2); line-height: 1.6; }

.dd-fig { margin: 30px 0 30px; max-width: 760px; }
.dd-head { margin-bottom: 10px; }
.dd-title { font-size: 17px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; margin: 0; }
.dd-sub { font-size: 14px; color: var(--muted); margin: 2px 0 0; }
.dd-key-old { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.dd-key li { padding: 0; display: inline-flex; align-items: center; gap: 8px; }
.dd-key li::before { content: none; }
.dd-key i { width: 16px; height: 2px; border-radius: 2px; display: inline-block; }
.dd-key b { color: var(--ink); font-weight: 600; }
.dd-plot { position: relative; margin-top: 8px; }
.dd-plot svg { display: block; width: 100%; height: auto; overflow: visible; }
.dd-plot .g line { stroke: var(--dd-grid); stroke-width: 1; }
.dd-plot .g line.zero { stroke: var(--rule-strong); opacity: .45; }
.dd-plot text { fill: var(--muted); font-size: 12px; font-family: var(--body); font-variant-numeric: tabular-nums; }
.dd-plot text.lab { fill: var(--ink-2); font-size: 13px; }
.dd-plot .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.dd-plot .dot { stroke: var(--paper); stroke-width: 2; }
.dd-plot .xh { stroke: var(--ink-2); stroke-width: 1; opacity: .5; }
.dd-tip { position: absolute; top: 0; pointer-events: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 9px; font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
.dd-tip i { width: 10px; height: 2px; display: inline-block; margin-right: 6px; vertical-align: 3px; }
.dd-fig figcaption { font-size: 15.5px; line-height: 1.55; color: var(--ink-2); max-width: 46em; margin-top: 10px; }
.dd-score { border-collapse: collapse; width: 100%; max-width: 560px; margin: 14px 0 6px; font-variant-numeric: tabular-nums; }
.dd-score th, .dd-score td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--rule); text-align: right; font-size: 14.5px; color: var(--ink-2); font-weight: 500; }
.dd-score th[scope="row"] { text-align: left; color: var(--muted); font-weight: 500; }
.dd-score thead th { color: var(--ink); font-weight: 600; font-size: 14px; white-space: nowrap; border-bottom-color: var(--rule-strong); }
.dd-score thead i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; margin-right: 7px; vertical-align: 4px; }
.dd-score tr.big td { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); line-height: 1.1; padding-top: 10px; padding-bottom: 10px; }
.dd-score tr.big th { color: var(--ink-2); }
.dd-point { margin: 14px 0 0; max-width: 40em; font-size: 16.5px; line-height: 1.55; color: var(--ink); }
.dd-point a { white-space: nowrap; font-weight: 600; }
.work-h { font-size: 21px; font-weight: 800; letter-spacing: -0.01em; color: var(--ink); margin: 40px 0 10px; }
#background .p-head + .work-h { margin-top: 18px; }
.ex-card { background: var(--ex-card); border-radius: 10px; padding: 14px 14px 12px; color: var(--ex-ink); margin-top: 10px; }
.ex-card .dd-plot { margin-top: 0; }
.ex-card .dd-plot text { fill: var(--ex-ink); font-size: 12.5px; }
.ex-card .dd-plot text.ttl { font-weight: 700; font-size: 13.5px; }
.ex-card .dd-plot text.ylab { font-weight: 700; font-size: 12px; }
.ex-card .dd-plot .g line { stroke: var(--ex-grid); stroke-width: 1.2; }
.ex-card .xh { stroke: var(--ex-ink); opacity: .35; }
.ex-key { display: flex; justify-content: center; margin-top: 6px; }
.ex-key > span { display: inline-flex; gap: 18px; font-size: 13px; }
.ex-key i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; vertical-align: -1px; margin-right: 6px; }
.ex-src { font-size: 11.5px; color: #444; margin: 8px 0 0; }
.pubs-list { list-style: none; margin: 18px 0 0; padding: 0; max-width: 46em; }
.pubs-list li { padding: 12px 0; border-top: 1px solid var(--rule); }
.pubs-list li::before { content: none; }
.pubs-list .pt { font-weight: 700; color: var(--ink); }
.pubs-list .pm { display: block; font-size: 13.5px; color: var(--muted); margin-top: 2px; }
.pubs-list .pd { display: block; color: var(--ink-2); margin-top: 4px; }
.pubs-h { font-size: 17px; font-weight: 700; color: var(--ink); margin: 30px 0 0; }
.pubs-note { font-size: 14px; color: var(--muted); margin: 10px 0 0; max-width: 46em; }
.regs { list-style: none; margin: 14px 0 0; padding: 0; max-width: 46em; }
.regs li { display: grid; grid-template-columns: 78px 1fr; gap: 0 14px; padding: 10px 0; border-top: 1px solid var(--rule); }
.regs li::before { content: none; }
.regs .rf { font-size: 13px; color: var(--muted); padding-top: 2px; }
.regs .rt { font-weight: 700; color: var(--ink); }
.regs .rd { display: block; color: var(--ink-2); margin-top: 2px; }
#drinkdock .wd-concept img { border-radius: 10px; border: 1px solid var(--shot-border); }
#drinkdock .wd-concept + .wd-concept { margin-top: 18px; }

/* band */
.band { margin: 40px 0 8px; }
.band-strip { display: flex; height: 128px; border-radius: 6px; overflow: hidden; }
.bs { -webkit-appearance: none; appearance: none; border-radius: 0; flex: var(--w) 1 0; min-width: 14px; border: 0; padding: 0; margin: 0; cursor: pointer; transition: flex-grow .3s ease; display: block; height: 100%; position: relative; background: none; }
/* Safari lays out a button's children in its own inner box, so the four tints are positioned against the button itself. */
.bs i { position: absolute; left: 0; right: 0; display: block; }
.bs i:nth-child(1) { top: 0; height: 58%; } .bs i:nth-child(2) { top: 58%; height: 14%; } .bs i:nth-child(3) { top: 72%; height: 14%; } .bs i:nth-child(4) { top: 86%; bottom: 0; }
.bs[aria-pressed="true"] { flex-grow: calc(var(--w) * 1.5 + 1); }
.bs:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }
.band figcaption { margin-top: 10px; display: grid; gap: 2px; max-width: 62em; }
.band-lede a { white-space: nowrap; }
.band-lede { font-size: 14px; color: var(--muted); }
.band-now { font-size: 14px; color: var(--ink); display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.band-chip { width: 12px; height: 12px; border-radius: 3px; display: inline-block; align-self: center; }
.band-name { font-weight: 700; }
.band-hex { font-variant-numeric: tabular-nums; color: var(--muted); }
.band-note { color: var(--ink-2); }
.band-more { font-size: 14px; justify-self: start; }
@media (max-width: 700px) { .band { margin-top: 32px; } .band-strip { height: 96px; } }
@media (prefers-reduced-motion: reduce) { .bs { transition: none; } }
.pal-full { background: #FBFBF8; border: 1px solid var(--rule); border-radius: 10px; padding: 12px; color: #1C2016; }
.pcards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 620px) { .pcards { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.highlights .pcards li { padding-left: 0; } .highlights .pcards li::before { content: none; }
.pcopy { appearance: none; width: 100%; text-align: left; font: inherit; color: inherit; background: #fff; border: 1px solid #E3E5DC; border-radius: 8px; padding: 0 0 8px; cursor: pointer; display: grid; overflow: hidden; }
.pcopy i { display: block; height: 44px; margin-bottom: 8px; }
.pcopy span { padding-inline: 10px; }
.pn { font-weight: 700; font-size: 14px; color: #1C2016; } .ph, .pv { font-size: 12.5px; color: #454B3D; font-variant-numeric: tabular-nums; }
.pc.later .pn::after { content: ' (later)'; font-weight: 500; color: #6A705F; }
.pcopy:focus-visible { outline: 2px solid #275C90; outline-offset: 2px; }
.pcopy.copied .ph::after { content: '  copied'; color: #275C90; font-weight: 700; }
/* /band */

/* projects table blurbs */
.holdings td.w { color: var(--ink); }
.holdings .w-more { display: block; margin-top: 4px; color: var(--ink-2); font-size: 14.5px; line-height: 1.45; max-width: 44em; }
/* project pages */
.proj-top .toplinks a { white-space: nowrap; }
.proj-more { padding-block: 40px 8px; border-top: 1px solid var(--rule); margin-top: 48px; }
.proj-more ul { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 10px; }
.proj-more li { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.proj-more li a { font-weight: 600; }
.proj-more li span { color: var(--ink-2); font-size: 14.5px; }
/* details sections */
.deep { margin-top: 56px; padding-top: 36px; border-top: 1px solid var(--rule); }
.feat { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px 44px; padding-block: 28px; border-bottom: 1px solid var(--rule); }
.feat-text { min-width: 0; }
.feat:last-child { border-bottom: 0; }
.feat h3 { margin: 0 0 8px; font-size: 1.25rem; font-weight: 800; letter-spacing: -0.01em; }
.feat p { margin: 0 0 10px; color: var(--ink-2); max-width: 36em; }
.feat-fig { margin: 0; }
.feat-fig img { display: block; width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--shot-border); background: var(--surface); }
.feat-fig.phone img { max-width: 300px; }
.feat-fig figcaption { margin-top: 8px; font-size: 13.5px; color: var(--muted); }
.feat-code { margin: 12px 0 0; padding: 14px 16px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; overflow-x: auto; font: 12.5px/1.55 var(--mono); color: var(--ink-2); max-width: 40em; }
@media (min-width: 860px) {
  .feat.has-fig { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); align-items: start; }
  .feat.has-fig.phone { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); }
  .feat:not(.has-fig) .feat-text { max-width: 44em; }
}
.feat.wide .feat-fig { margin-top: 2px; }
.feat-frame iframe { display: block; width: 100%; border: 1px solid var(--shot-border); border-radius: 12px; background: #141619; }
.feat-frame.phone iframe { max-width: 420px; }
/* /project pages */

/* dreamy beta line */
.beta-line { margin: 18px 0 6px; padding: 14px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); font-size: 1.15rem; line-height: 1.45; color: var(--ink); max-width: 36em; }
.beta-line strong { font-weight: 700; color: var(--c-msblue); }

/* Dreamy button: MS Blue, filled on hover. */
.deep-link.dd-cta { margin-top: 10px; border: 2px solid var(--c-msblue); }
.deep-link.dd-cta:hover { background: var(--c-msblue); border-color: var(--c-msblue); color: var(--paper); }

/* walldrobe page */
.wd-hero { margin: 10px 0 0; }
.wd-hero img, .wd-wide img { display: block; width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--shot-border); background: var(--surface); }
.wd-hero figcaption { margin-top: 8px; font-size: 13.5px; color: var(--muted); }
.wd-phone img { max-width: 280px; padding: 6px; border-radius: 24px; background: var(--surface); }
.wd-flow { grid-template-columns: minmax(0, 1fr); }
.wd-steps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 14px; margin-top: 4px; }
.wd-steps figure { margin: 0; min-width: 0; }
.wd-dev { padding: 5px; border-radius: 22px; background: var(--surface); border: 1px solid var(--shot-border); }
.wd-dev img { display: block; width: 100%; height: auto; border-radius: 17px; }
.wd-steps figcaption { margin-top: 8px; font-size: 14px; font-weight: 600; color: var(--ink); }
@media (min-width: 700px) { .wd-steps { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 26px 22px; max-width: 840px; } }
.wd-walls { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; margin-top: 4px; }

/* cv: where I've been, right under the name */

/* the ending: what I want, then one action */

/* Exhibit 1, the path: my story down the left, and a picture of each thing I made at the stop where I made it.

.kinds { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 12px 0 0; font-size: 14px; line-height: 1.4; color: var(--ink-2); }

.path { list-style: none; margin: 30px 0 0; padding: 0; }
.stop { position: relative; padding: 0 0 36px 40px; display: grid; grid-template-columns: 230px minmax(0, 1fr); column-gap: 28px; row-gap: 14px; align-items: start; }

.sn:hover .dot { background: var(--c-msblue); }
.sn:focus-visible, .tiles a:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; border-radius: 4px; }

@media (min-width: 760px) and (max-width: 1099px) {

}

  .tiles a { width: auto; }

}

/* Read it in order: a book's contents page. Number, chapter, a dotted leader to the arrow, and one line on what's in it. */
.chapters { padding-block: 56px; border-top: 1px solid var(--rule); }
.chapters .label { margin: 0 0 16px; }

.toc a { display: grid; grid-template-columns: 12px auto minmax(28px, 1fr); grid-template-areas: "n t lead" ". d d"; align-items: baseline; gap: 4px 14px; padding: 18px 0 17px; color: var(--ink); text-decoration: none; }
.toc .n { grid-area: n; width: 12px; height: 12px; border-radius: 50%; background: var(--pc, var(--c-msblue)); align-self: center; font-variant-numeric: tabular-nums; }
.toc .t { grid-area: t; font-size: clamp(1.2rem, 2vw, 1.45rem); font-weight: 800; letter-spacing: -0.015em; line-height: 1.2; }

.toc .lead::before { content: ''; flex: 1; border-bottom: 2px dotted var(--rule-strong); opacity: .5; }
.toc .lead::after { content: '\2192'; font-size: 20px; line-height: 1; }

/* stop pages: the job, then what I made there, with long stories folded */

details.more { margin: 10px 0 0; max-width: 46em; }

details.more > summary::-webkit-details-marker { display: none; }

/* route bar: the stops of the site in order. Filled dot = you've been there, ring = you are here. */
.route-nav { margin: 0; }
.route-nav ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 0; }

.route-nav a { display: inline-flex; align-items: center; gap: 7px; padding: 8px 2px; font-size: 14px; color: var(--muted, #9AA5B2); text-decoration: none; white-space: nowrap; }
.route-nav a:hover { color: var(--ink, #E7ECF1); }
