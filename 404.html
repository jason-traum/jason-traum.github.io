/* Chartbook: the page reads like one of my Morgan Stanley research reports, numbered exhibits with a takeaway title and a source line,

:root {

    --c-msblue: #6FA0D6; --c-razz: #5AAEFF; --c-jade: #5CC495; --c-amethyst: #A593EC; --c-carrot: #E8834F; --c-honey: #E8AE2E;

}

body { border-top: 10px solid var(--c-msblue); }

#wharton-os { --c: var(--c-amethyst); } #walldrobe { --c: var(--c-honey); }
.project { border-top: 1px solid var(--rule); position: relative; }
.project::before { content: ""; position: absolute; left: 0; top: -1px; width: 88px; height: 5px; background: var(--c, var(--olive)); }
.p-head .exh { order: -1; }
.holdings td.p .sw2 { display: inline-block; width: 10px; height: 10px; margin-right: 9px; background: var(--c); vertical-align: 0; }
.deep-link { border-color: var(--c, var(--ink)); }

/* Exhibit 1: the build log */
.log-wrap { overflow-x: auto; }
.log { width: 100%; max-width: 860px; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.log th { font-weight: 500; font-size: 12.5px; color: var(--muted); text-align: left; padding: 0 8px 0 0; white-space: nowrap; width: 58px; }
.log thead th { text-align: center; width: auto; padding-bottom: 4px; }
.log thead th:last-child, .log td.t { text-align: right; }
.log td { height: 28px; text-align: center; border-bottom: 1px solid var(--rule); padding: 0; }
.log td i { display: inline-block; border-radius: 50%; vertical-align: middle; }
.log td.t { font-weight: 700; font-size: 15px; width: 64px; }
.log tr.pause td { height: 36px; font-size: 13.5px; color: var(--muted); text-align: left; padding-left: 10px; background: var(--surface); }
.d-dreamy { background: var(--c-msblue); } .d-in { background: var(--c-jade); } .d-5k { background: var(--c-carrot); }
.log-key { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13.5px; color: var(--ink-2); margin-bottom: 10px; }
.log-key i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.log td i.race, .log-key i.race { width: 14px; height: 14px; border-radius: 50%; background: transparent; border: 2.5px solid var(--c-honey); box-sizing: border-box; }
.d-wd { background: var(--c-honey); } .d-other { background: var(--c-amethyst); } .d-ink { background: var(--ink-2); }
.log td i.chat, .log-key i.chat { width: 8px; height: 8px; border-radius: 1px; }
.log-key.k2 { margin-top: -4px; color: var(--muted); }
.log td { height: 24px; }
.log td.t2 { text-align: right; width: 52px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 480px) {
  .log th { width: 46px; font-size: 11.5px; }
  .log thead th { font-size: 11px; }
  .log td.t { width: 42px; font-size: 13.5px; }
  .log td.t2 { width: 34px; font-size: 12.5px; }
}
.log { table-layout: fixed; }
.log thead th:first-child { width: 58px; }
.log thead th:last-child { width: 70px; }
@media (max-width: 480px) {
  .log thead th:first-child { width: 44px; }
  .log thead th:last-child { width: 50px; }
}

/* skills */
:root { --k-msblue: #1B436D; --k-razz: #1F72D0; --k-jade: #23774F; --k-amethyst: #6450B8; --k-carrot: #B04A1C; --k-honey: #8A5E00; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --k-msblue: #A9C3E2; --k-razz: #4FA8FF; --k-jade: #5CC495; --k-amethyst: #A593EC; --k-carrot: #E8834F; --k-honey: #E8AE2E; } }
:root[data-theme="dark"] { --k-msblue: #A9C3E2; --k-razz: #4FA8FF; --k-jade: #5CC495; --k-amethyst: #A593EC; --k-carrot: #E8834F; --k-honey: #E8AE2E; }
.kcloud { position: relative; }
.kgroup { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; }
.kgroup li::before { content: none; }
.kw { appearance: none; background: none; border: 0; padding: 0; margin: 0; font: inherit; color: var(--k); cursor: pointer; line-height: 1; white-space: nowrap; letter-spacing: -0.01em; border-radius: 3px; }
.kw1 { font-size: 14px; font-weight: 500; } .kw2 { font-size: 17px; font-weight: 600; } .kw3 { font-size: 22px; font-weight: 700; }
.kw4 { font-size: 29px; font-weight: 800; letter-spacing: -0.02em; } .kw5 { font-size: 38px; font-weight: 900; letter-spacing: -0.025em; }
.kw[aria-pressed="true"] { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 0.16em; }
.kw:focus-visible { outline: 2px solid var(--k); outline-offset: 2px; }
.kcloud.placed .kgroup { display: contents; }
.kcloud.placed .kgroup li { display: contents; }
.kcloud.placed .kw { position: absolute; left: 0; top: 0; }
.kcloud.placed { transition: opacity .25s; }
.kcloud[data-filter] .kw { opacity: .16; }
.kcloud[data-filter="quant"] [data-cat="quant"], .kcloud[data-filter="eng"] [data-cat="eng"], .kcloud[data-filter="product"] [data-cat="product"],
.kcloud[data-filter="comm"] [data-cat="comm"], .kcloud[data-filter="lead"] [data-cat="lead"], .kcloud[data-filter="me"] [data-cat="me"] { opacity: 1; }
.kaxis { margin-top: 18px; }
.kchips { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.kchip { appearance: none; background: none; border: 0; border-top: 3px solid var(--k); padding: 7px 2px 4px; font: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink-2); text-align: left; cursor: pointer; min-height: 40px; line-height: 1.25; }
.kchip i { display: none; }
.kchip[aria-pressed="true"] { color: var(--k); }
.kchip:hover { color: var(--k); }
.kchip:focus-visible { outline: 2px solid var(--k); outline-offset: 2px; }
.kends { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin: 2px 0 0; }
.kdetail { margin-top: 18px; padding: 12px 0 14px; border-top: 1px solid var(--rule); min-height: 118px; position: sticky; bottom: 0; z-index: 2; background: var(--paper); }
.kdetail > * { max-width: 46em; }
.kdetail .kmeta { margin: 0; font-size: 13.5px; font-weight: 700; color: var(--k); }
.kdetail .kword { margin: 2px 0 4px; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.015em; line-height: 1.2; }
.kdetail .kproof { margin: 0; color: var(--ink-2); }
.skills .src { margin-top: 14px; }
.kview { display: none; justify-content: flex-end; margin: -8px 0 6px; }
.kswitch { appearance: none; background: none; font: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink); border: 1px solid var(--rule-strong); border-radius: 6px; padding: 8px 12px; min-height: 40px; cursor: pointer; }
.kswitch:hover { background: var(--ink); color: var(--paper); }
.kswitch:focus-visible { outline: 2px solid var(--olive); outline-offset: 2px; }
.skills.kjs .kview { display: flex; }
.skills:not(.kjs) .kcloudview { display: none; }
.skills.kjs .klist { display: none; }
.skills.kjs.klisting .klist { display: block; }
.skills.kjs.klisting .kcloudview { display: none; }
.klist { border-top: 1px solid var(--rule); }
.klg { display: grid; gap: 6px 40px; padding: 16px 0; border-bottom: 1px solid var(--rule); }
@media (min-width: 860px) { .klg { grid-template-columns: 3fr 9fr; } }
.klg h3 { margin: 0; font-size: 1rem; font-weight: 800; color: var(--k); display: flex; align-items: baseline; gap: 9px; }
.klg h3 i { width: 10px; height: 10px; background: var(--k); display: inline-block; flex: none; }
.klg dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 7px 20px; font-size: 15px; }
.klg dt { font-weight: 700; }
.klg dd { margin: 0; color: var(--ink-2); }
@media (max-width: 559px) { .klg dl { grid-template-columns: 1fr; gap: 2px; } .klg dd { margin-bottom: 8px; } }
@media (max-width: 699px) {
  .kchips { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 14px; }
  .kcloudview { display: flex; flex-direction: column; }
  .kaxis { order: -1; margin: 0 0 16px; }
  .kcloud { order: 0; }
  .kdetail { order: 1; }
  .kends { display: none; }
  .kw1 { font-size: 12.5px; } .kw2 { font-size: 14px; } .kw3 { font-size: 17px; } .kw4 { font-size: 21px; } .kw5 { font-size: 26px; }
  .kdetail { min-height: 0; }
  .kdetail .kword { font-size: 1.15rem; }
  .kdetail .kproof { font-size: 15px; line-height: 1.45; }
}
@media (pointer: coarse) { .kchip, .kswitch { min-height: 44px; } }
@media (prefers-reduced-motion: reduce) { .kcloud.placed { transition: none; } }
/* /skills */

.nf { padding-block: 18vh 12vh; display: grid; gap: 18px; }
</style>
