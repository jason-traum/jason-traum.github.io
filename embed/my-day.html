ng Course Match plan\", \"u\": \"https://claude.ai/artifact/5i4MpmEzDkUN2UFbUZVZq9\"}], \"bands\": [{\"from\": \"2026-11-26\", \"to\": \"2026-11-29\", \"label\": \"Thanksgiving\"}], \"builtAt\": \"2026-11-18T17:42:27-05:00\"}, \"study\": {\"bepp6120\": {\"title\": \"BEPP 6120: top 15 for the final\", \"points\": [\"Solve Cournot: q = 45 - q_j/2, 30 each, price $40, profit $900. Cost case 32 and 29 at $39. A big share signals low cost.\", \"Moral hazard contract: b* = c/(P - rho), w* = m - rho b*. Expected pay is m + c. Induce effort only if mu > b*.\", \"EV, EU, CE, RP and WTP with sqrt or ln utility only. WTP = expected loss + risk premium. Ties go to buying.\", \"Insurance adverse selection: marginal cost slopes down, price = average cost, undercutting loses money, a mandate creates value but some lose.\", \"Bundling: check only each type's value as the price. Negative correlation is necessary but not sufficient.\", \"Demographic pricing: MR = MC in each group, add quantities for the one-price case, always weakly better, total surplus can fall.\", \"Grim trigger: r <= (C - W)/(T - C). W is the Cournot profit, not the cheated-on cell.\", \"Differentiated Bertrand: use your own demand, best-response slope below 1, prices are strategic complements.\", \"Self-selection: participation is easy, incentive compatibility is hard. Degrade or drop the cheap tier.\", \"Lemons: the market unravels; a warranty works as a signal.\", \"One owner of two substitutes: steeper best responses, both prices rise.\", \"Stackelberg: leader 80, follower 40, price $70. Needs commitment; with a revision stage the follower leads.\", \"Bertrand and capacity: price = cost needs no capacity limit and no fixed cost. With a cap, price is where demand equals total capacity.\", \"Perfect price discrimination: efficient, zero consumer surplus, fails with resale.\", \"Risk aversion in contracts: intuition only. Pay rises with risk aversion; the algebra is off the exam.\"], \"off\": \"Off the exam: N-firm math, entry-deterrence math, the demand derivation, mixed bundling, the risk-averse algebra.\"}, \"oidd6110\": {\"title\": \"OIDD 6110: top 15 for the final\", \"points\": [\"Bottleneck = highest implied utilization, for the rest of the course. Never the longest processing time. To move a worker, compare 60/p.\", \"The chain: implied utilization, bottleneck, process capacity, flow rate = min(demand, capacity), utilization, cycle time, labor cost on the actual flow rate.\", \"Waiting explodes as utilization nears 100%. u/(1-u): 0.8 gives 4, 0.9 gives 9, 0.95 gives 19. He said 'you can bet' on it.\", \"Waiting formula: exponent sqrt(2(m+1)) - 1, check it with m = 1, carry three decimals. Tq is only the line.\", \"The Cp question, one in every final. Put the table on your cheat sheet. Spec limits come from outside, control limits from the data.\", \"Several flow units: max flow = demand / bottleneck implied utilization. The mix is given.\", \"Funnels: target inflow = outflow / yield. Capacity as input or as output.\", \"Little's Law on any piece with the same units. For a firm use COGS, never revenue.\", \"Labor content, idle time, labor utilization, and time for X units from a full or an empty line.\", \"Build-up: waiting ends when inventory falls back to the storage line. Cranberry: a dryer beats bins.\", \"Rework p(1 + r), parallel paths take the min, and work a messy diagram in order.\", \"Pooling keeps utilization the same and cuts waiting. Two costs, two caveats. Shortest job first cuts average wait.\", \"Process flow diagrams: a required step is a box, optional waiting is a triangle, bins are storage.\", \"Takt = available time / demand. Target manpower stays a decimal. Idle time beats overproduction.\", \"The cases: Capital One bottleneck is underwriting at 211.7%, max 330.6 loans a month. Call center: nearly 60% of paid time is not value-added.\"], \"off\": \"Rules: about 35 questions, no partial credit, no carryover, one two-sided sheet. HW1 plus HW2 is l <script>
(function(){

  function go(v){ if (!/^[a-z]+(\.[a-z]+){0,2}$/.test(v)) return; const [tab, sub, play] = v.split('.');

    if (sub) setTimeout(() => { click('[data-act="sub"][data-v="' + sub + '"]'); if (play) setTimeout(() => click('[data-act="rpplay"]'), 700); }, 200); }
