.chk input { width: 16px; height: 16px; accent-color: var(--won); margin: 0; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h2 { margin: 18px 0 2px; font-size: 16px; font-weight: 600; }
.sub { margin: 0 0 6px; font-size: 13.5px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 0 0; font-size: 13px; color: var(--ink-2); min-height: 19px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.chart { position: relative; }
svg { display: block; width: 100%; overflow: visible; }
svg text { font-family: var(--body); font-variant-numeric: tabular-nums; }
.tip { position: absolute; pointer-events: none; background: #0D0F12; border: 1px solid var(--rule); border-radius: 8px; padding: 7px 9px; font-size: 13px; line-height: 1.4;

  function color(g, i) { return g === 'result' ? (i === 0 ? col('--won') : col('--lost')) : col('--w' + (i + 1)); }

  function ticks(lo, hi, n) { var span = hi - lo, step = Math.pow(10, Math.floor(Math.log10(span / n))), err = span / n / step;
    step *= err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1; var t = [], s = Math.ceil(lo / step) * step; for (; s <= hi + 1e-9; s += step) t.push(+s.toFixed(6)); return t; }

  var chart = $('chart'), tip = $('tip'), svg = null;

  function hideTip() { tip.style.opacity = 0; }
  function draw() {
    var v = DATA.vars[state.v], groups = v.by[state.g], W = Math.max(280, chart.clientWidth), narrow = W < 520;
    $('cap').textContent = (state.t === 'box' ? 'Box plot: ' : 'Density: ') + v.label.toLowerCase().replace(/^./, function (c) { return c.toUpperCase(); });
    $('sub').textContent = 'Fighter 1 minus fighter 2, from their earlier UFC fights. ' + v.n.toLocaleString() + ' fights.';
    $('legend').innerHTML = groups.map(function (r, i) { return '<span><i style="background:' + color(state.g, i) + '"></i>' + r.g + '</span>'; }).join('');
    if (svg) svg.remove();

    var X = function (x) { return x0 + (Math.max(lo, Math.min(hi, x)) - lo) / (hi - lo) * (x1 - x0); };
    var H, plotTop = 6, plotBot;
    if (state.t === 'box') { var row = state.g === 'result' ? 78 : (narrow ? 46 : 40); H = plotTop + groups.length * row + 36; plotBot = H - 30; }
    else { H = narrow ? 240 : 280; plotBot = H - 30; }
    svg = mk('svg', { viewBox: '0 0 ' + W + ' ' + H, height: H, role: 'img', 'aria-label': (state.t === 'box' ? 'Box plot' : 'Density plot') + ' of ' + v.label + ' by ' + (state.g === 'result' ? 'result' : 'weight class') });
    chart.insertBefore(svg, tip);
    var tk = ticks(lo, hi, narrow ? 4 : 7);
    tk.forEach(function (t) { mk('line', { x1: X(t), x2: X(t), y1: plotTop, y2: plotBot, stroke: t === 0 ? '#59616B' : col('--grid'), 'stroke-width': 1, 'stroke-dasharray': t === 0 ? '3 3' : '' }, svg);
      var tx = mk('text', { x: X(t), y: plotBot + 18, 'text-anchor': 'middle', 'font-size': 12, fill: col('--muted') }, svg); tx.textContent = (t > 0 ? '+' : '') + t; });
    mk('line', { x1: x0, x2: x1, y1: plotBot, y2: plotBot, stroke: col('--rule') }, svg);
    var unit = mk('text', { x: x1, y: H - 0, 'text-anchor': 'end', 'font-size': 12, fill: col('--muted') }, svg); unit.textContent = v.unit === 'points' ? 'percentage points' : v.unit;
    if (state.t === 'box') {
      groups.forEach(function (r, i) {
        var c = color(state.g, i), y = plotTop + i * row, mid = y + row / 2 + (state.g === 'wc' ? 6 : 4), bh = state.g === 'result' ? 30 : 16;
        var lab = mk('text', { x: x0, y: y + 13, 'font-size': 12.5, fill: col('--ink-2') }, svg); lab.textContent = r.g;
        if (state.pts) { var seed = 1 + i * 97; r.pts.forEach(function (p) { seed = (seed * 9301 + 49297) % 233280; var j = (seed / 233280 - 0.5) * bh * 1.3;
          mk('circle', { cx: X(p), cy: mid + j, r: state.g === 'result' ? 2.2 : 1.8, fill: c, 'fill-opacity': 0.32 }, svg); }); }
        var b = r.box;
        mk('line', { x1: X(b[0]), x2: X(b[1]), y1: mid, y2: mid, stroke: c, 'stroke-width': 2 }, svg);
        mk('line', { x1: X(b[3]), x2: X(b[4]), y1: mid, y2: mid, stroke: c, 'stroke-width': 2 }, svg);
        mk('rect', { x: X(b[1]), y: mid - bh / 2, width: Math.max(2, X(b[3]) - X(b[1])), height: bh, rx: 4, fill: c, 'fill-opacity': 0.22, stroke: c, 'stroke-width': 2 }, svg);
        mk('line', { x1: X(b[2]), x2: X(b[2]), y1: mid - bh / 2, y2: mid + bh / 2, stroke: col('--ink'), 'stroke-width': 2.5 }, svg);
        var hit = mk('rect', { x: x0, y: y, width: x1 - x0, height: row, fill: 'transparent', tabindex: 0 }, svg);
        var html = '<b>' + r.g + '</b> <span class="m">' + r.n.toLocaleString() + ' fights</span><br>Median ' + fmt(b[2], v.unit) + '<br><span class="m">Middle half</span> ' + fmt(b[1], v.unit) + ' to ' + fmt(b[3], v.unit);
        var on = function () { showTip(html, X(b[2]), mid - bh / 2); };
        hit.addEventListener('mouseenter', on); hit.addEventListener('focus', on); hit.addEventListener('mouseleave', hideTip); hit.addEventListener('blur', hideTip);
        hit.addEventListener('click', on);
      });
    } else {
      var top = 0; groups.forEach(function (r) { r.dens.forEach(function (d) { if (d > top) top = d; }); });
      var Y = function (d) { return plotBot - d / top * (plotBot - plotTop - 4); };
      groups.forEach(function (r, i) { var c = color(state.g, i), pts = v.grid.map(function (g, k) { return X(g) + ',' + Y(r.dens[k]); }).join(' ');
        mk('polygon', { points: X(v.grid[0]) + ',' + plotBot + ' ' + pts + ' ' + X(v.grid[v.grid.length - 1]) + ',' + plotBot, fill: c, 'fill-opacity': state.g === 'result' ? 0.18 : 0.06 }, svg);
        mk('polyline', { points: pts, fill: 'none', stroke: c, 'stroke-width': 2, 'stroke-linejoin': 'round' }, svg); });
      if (state.pts) { groups.forEach(function (r, i) { var c = color(state.g, i), seed = 3 + i * 31; r.pts.forEach(function (p) { seed = (seed * 9301 + 49297) % 233280;
        mk('circle', { cx: X(p), cy: plotBot - 6 - (seed / 233280) * 14, r: 1.7, fill: c, 'fill-opacity': 0.35 }, svg); }); }); }
      var cross = mk('line', { y1: plotTop, y2: plotBot, stroke: col('--ink-2'), 'stroke-width': 1, opacity: 0 }, svg);
      var hit = mk('rect', { x: x0, y: plotTop, width: x1 - x0, height: plotBot - plotTop, fill: 'transparent' }, svg);
      var move = function (ev) { var rc = svg.getBoundingClientRect(), px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - rc.left, xv = lo + (px - x0) / (x1 - x0) * (hi - lo);
        var k = Math.max(0, Math.min(v.grid.length - 1, Math.round((xv - lo) / (hi - lo) * (v.grid.length - 1)))), gx = v.grid[k];
        cross.setAttribute('x1', X(gx)); cross.setAttribute('x2', X(gx)); cross.setAttribute('opacity', 1);
        var html = '<b>' + fmt(gx, v.unit) + '</b>';
        if (state.g === 'result') { var a = groups[0].dens[k], b = groups[1].dens[k]; if (a > 0 && b > 0) {
          var rr = a / b; html += '<br>' + (rr >= 1 ? 'Fighter 1 won ' + rr.toFixed(1) + '&times; as often' : 'Fighter 1 lost ' + (1 / rr).toFixed(1) + '&times; as often'); } }
        else { var best = 0; groups.forEach(function (r, i) { if (r.dens[k] > groups[best].dens[k]) best = i; }); html += '<br><span class="m">Most common in</span> ' + groups[best].g; }
        showTip(html, X(gx), plotTop + 24); };
      hit.addEventListener('mousemove', move); hit.addEventListener('touchstart', move, { passive: true }); hit.addEventListener('touchmove', move, { passive: true });
      hit.addEventListener('mouseleave', function () { cross.setAttribute('opacity', 0); hideTip(); });
    }
    $('note').textContent = state.t === 'box' ? 'Each dot is a fight (a sample of them). The line in each box is the median.' : 'Hover to compare. Dots are a sample of fights.';
  }
  sel.addEventListener('change', function () { state.v = +sel.value; draw(); });
  $('grp').addEventListener('change', function (e) { state.g = e.target.value; draw(); });
  [].forEach.call(document.querySelectorAll('.seg button'), function (b) { b.addEventListener('click', function () {
    state.t = b.dataset.t; [].forEach.call(document.querySelectorAll('.seg button'), function (o) { o.setAttribute('aria-pressed', o === b); }); draw(); }); });
  $('pts').addEventListener('change', function (e) { state.pts = e.target.checked; draw(); });
  var lastW = 0; new ResizeObserver(function () { if (Math.abs(chart.clientWidth - lastW) > 2) { lastW = chart.clientWidth; draw(); } }).observe(chart);
  draw();
})();
