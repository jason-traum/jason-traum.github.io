:root{
  --bg:#0a0a0f;--s1:#141420;--s2:#1a1a24;--s3:#282836;
  --t1:#ededf2;--t2:#b8b8c8;--t3:#8888a0;--b1:#333345;--b2:#42425a;
  --acc:#7c6cf0;--glow:#a78bfa;

  --hr:#e04545;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--t1)}
body{font-family:"Inter",-apple-system,system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Manrope",-apple-system,system-ui,sans-serif;letter-spacing:-0.01em;margin:0}
.num,td,.v{font-variant-numeric:tabular-nums}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 48px}
header.top{padding:32px 0 12px}
header.top h1{font-size:30px;font-weight:800}
.who{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:10px;color:var(--t2);font-size:14px}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--glow);border:1px solid var(--b2);border-radius:999px;padding:2px 8px;white-space:nowrap}
.map{position:sticky;top:0;z-index:5;background:rgba(10,10,15,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--b1);margin:0 -16px;padding:8px 16px}
.map .row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.map .row::-webkit-scrollbar{display:none}
.map a{flex:0 0 auto;font-size:12px;color:var(--t3);text-decoration:none;border:1px solid var(--b1);border-radius:6px;padding:4px 8px;white-space:nowrap;transition:opacity .2s,color .2s,border-color .2s}
.map a.on{color:var(--t1);border-color:var(--acc)}
.map a .k{color:var(--t3);margin-right:4px}
.map .sep{flex:0 0 auto;align-self:center;width:1px;height:16px;background:var(--b2);margin:0 4px}
.part{margin:36px 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.part h2{font-size:20px;font-weight:700}
.part .sub{color:var(--t3);font-size:13px}
.pick{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.pick button{font:inherit;font-size:13px;color:var(--t2);background:var(--s1);border:1px solid var(--b1);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;transition:opacity .2s,border-color .2s,color .2s}
.pick button.on{color:var(--t1);border-color:var(--acc)}
.pick button .d{display:block;font-size:11px;color:var(--t3)}
.flow{position:relative}
.stage{position:relative;background:var(--s1);border:1px solid var(--b1);border-radius:12px;padding:16px;margin:0 0 22px;scroll-margin-top:56px}
.stage::after{content:"";position:absolute;left:28px;bottom:-23px;width:1px;height:22px;background:var(--b2)}
.stage.last::after{display:none}
.sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sh .n{font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums;min-width:20px}
.sh h3{font-size:16px;font-weight:700}
.sh .src{margin-left:auto;font-size:11px;color:var(--t3);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}
.line{color:var(--t2);font-size:13px;margin:6px 0 0 30px}
.io{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;margin-top:12px;align-items:stretch}
.io .box{background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:10px 12px;min-width:0}
.io .arrow{align-self:center;color:var(--t3);font-size:18px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin-bottom:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv .k{color:var(--t3)}
.kv .v{color:var(--t1);text-align:right;overflow-wrap:anywhere}
.kv .v.hi{color:var(--glow);font-weight:600}
@media (max-width:560px){.io{grid-template-columns:1fr}.io .arrow{transform:rotate(90deg);justify-self:center;line-height:1}.sh .src{margin-left:30px;flex:0 1 calc(100% - 30px)}}
.viz{margin-top:12px;background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:10px 12px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--t2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.legend i.sq{height:10px;width:10px;border-radius:2px}
svg{display:block;width:100%;overflow:visible}
.ax{font-size:11px;color:var(--t3);display:flex;justify-content:space-between;margin-top:4px;font-variant-numeric:tabular-nums}
.strip{display:flex;height:22px;border-radius:4px;overflow:hidden;gap:1px;background:var(--bg)}
.strip div{min-width:1px}
.lapgrid{display:grid;gap:3px;margin-top:8px;font-size:12px}
.laprow{display:grid;grid-template-columns:28px 1fr 64px 40px;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.laprow .bar{height:10px;border-radius:2px;background:var(--b2)}
.laprow .t{color:var(--t3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;border:1px solid var(--b1);border-radius:6px;padding:3px 8px;color:var(--t2);background:var(--s2);font-variant-numeric:tabular-nums}
.chip b{color:var(--t1);font-weight:600}
.dots{display:grid;gap:6px}
.drow{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;font-size:12px}
.drow .nm{color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .nm.off{color:var(--t3)}
.track{position:relative;height:18px;border-radius:3px;background:linear-gradient(var(--b1),var(--b1)) center/100% 1px no-repeat}
.dot{position:absolute;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:var(--acc)}
.dot.hollow{background:transparent;border:1.5px solid var(--t3)}
.vline{position:absolute;top:-3px;bottom:-3px;width:1.5px;background:var(--glow);transform:translateX(-50%)}
.drow .w{text-align:right;color:var(--t2);font-variant-numeric:tabular-nums}
@media (max-width:560px){.drow{grid-template-columns:96px 1fr 44px;gap:6px}}
.share{display:flex;height:16px;border-radius:4px;overflow:hidden;gap:1px;margin-top:8px}
.wf{display:grid;gap:8px}
.wrow{display:grid;grid-template-columns:120px 1fr 92px;gap:10px;align-items:center;font-size:12px}
.wrow .nm{color:var(--t2)}
.wrow .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--t1)}
.wrow .val small{display:block;color:var(--t3);font-size:11px}
.wtrack{position:relative;height:20px;background:linear-gradient(var(--b1),var(--b1)) center/100% 1px no-repeat}
.wbar{position:absolute;top:3px;height:14px;border-radius:2px;background:var(--acc)}
.wbar.zero{background:transparent;border-left:1.5px dashed var(--t3);border-radius:0}
.wpt{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);background:var(--t1)}
@media (max-width:560px){.wrow{grid-template-columns:78px 1fr 70px;gap:6px}}
.band{position:absolute;top:4px;height:12px;border-radius:6px;background:rgba(124,108,240,.28);border:1px solid var(--acc)}
.mk{position:absolute;top:-2px;bottom:-2px;width:2px;transform:translateX(-50%)}
.end{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.end .box{background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:10px 12px;min-width:0}
.end .big{font-size:24px;font-weight:700;font-family:"Manrope",-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.end .sm{font-size:12px;color:var(--t3)}
@media (max-width:560px){.end{grid-template-columns:1fr}}
.note{font-size:12px;color:var(--t3);margin-top:8px}
.bridge{margin:4px 0 26px 0;padding:12px 16px;border:1px dashed var(--b2);border-radius:12px;color:var(--t2);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.bridge b{color:var(--t1);font-variant-numeric:tabular-nums}
footer{color:var(--t3);font-size:12px;border-top:1px solid var(--b1);padding-top:14px;margin-top:28px}
</style>

    var AX = function (t) { return ((t - alo) / (ahi - alo) * 100).toFixed(2) + '%'; };
    var aviz = '<div class="wtrack" style="height:26px"><span class="wbar" style="left:' + AX(A.floored) + ';width:' + ((A.raw - A.floored) / (ahi - alo) * 100).toFixed(2) + '%;background:rgba(124,108,240,.45)"></span>' +
      '<span class="wpt" style="left:' + AX(A.raw) + ';background:var(--t3)"></span><span class="wpt" style="left:' + AX(A.floored) + ';background:var(--acc)"></span>' +
      '<span class="mk" style="left:' + AX(F.truth.scored) + ';background:var(--z-easy)"></span></div>' +
      '<div class="ax"><span>' + fmtT(alo) + '</span><span>' + fmtT(ahi) + '</span></div>' +
      '<div class="legend"><span><i class="sq" style="background:var(--t3);border-radius:50%"></i>raw ' + fmtT(A.raw) + '</span><span><i class="sq" style="background:var(--acc);border-radius:50%"></i>after floor ' + fmtT(A.floored) + '</span><span><i style="background:var(--z-easy);width:2px;height:10px"></i>scored truth (rested, ' + esc(F.evalDate) + ') ' + fmtT(F.truth.scored) + '</span></div>';
    h += stage('f4', 13, 'Race anchor', 'unifiedRaceAnchor', null,
      io([['Training reference', r(A.trainingRefVdot, 1) + ' VDOT'], ['HR VO2max part', r(comp.hrVo2max, 1)], ['Interval part', r(comp.intervalPeak, 1)], ['CS part', r(comp.csProxy, 1)], ['Threshold part', r(comp.ltProxy, 1)], ['Anchors accepted', A.acceptedCount + ' of ' + A.anchorCount]],
        [['Raw estimate', fmtT(A.raw)], ['Floor', fmtT(A.floorSeconds) + ' (' + r(A.floorVdot, 1) + ' VDOT)'], ['Floor source', A.floorSourceKind + ', ' + r(A.floorSourceMeters / 1000, 1) + ' km'], ['Clamped', A.clamp ? 'yes' : 'no'], ['Anchor estimate', fmtT(A.estimate), true], ['Change', sgn(A.estimate - A.raw, 0) + ' s']]) +
      '<div class="viz">' + aviz + '</div>');

    // blend shares
    var live = F.models.filter(function (m) { return m.share > 0; }).sort(function (a, b) { return b.share - a.share; });
    var shades = ['var(--acc)', 'var(--glow)', 'var(--z-tempo)', 'var(--z-marathon)', 'var(--z-steady)', 'var(--z-easy)', 'var(--z-recovery)', 'var(--t3)'];
    var bar = '<div class="share">' + live.map(function (m, i) { return '<div title="' + esc(m.label) + '" style="flex:' + m.share + ' 0 0;background:' + shades[i % shades.length] + '"></div>'; }).join('') + '</div>';
    var bl = '<div class="legend">' + live.map(function (m, i) { return '<span><i class="sq" style="background:' + shades[i % shades.length] + '"></i>' + esc(m.label) + ' ' + r(m.share * 100, 1) + '%</span>'; }).join('') + '</div>';
    h += stage('f5', 14, 'Blend', 'blendForecasts', null,
      io([['Models with weight', live.length], ['Weight sum', r(F.weightSum, 3)], ['Weighted mean', fmtT(F.weightedMean)]], [['Blended time', fmtT(S.blend.seconds), true], ['p10', fmtT(S.blend.p10)], ['p90', fmtT(S.blend.p90)]]) +
      '<div class="viz"><div class="lbl">Share of the blend</div>' + bar + bl + '</div>');

    // waterfall
    var steps = [
      { nm: 'Blend', from: null, to: S.blend.seconds },
      { nm: 'Race floor', from: S.floor.beforeSeconds, to: S.floor.afterSeconds, sub: r(S.floor.strength * 100) + '% strength' },
      { nm: 'Durability', from: S.durability.beforeSeconds, to: S.durability.afterSeconds, sub: 'score ' + r(S.durability.durabilityScore * 100) },
      { nm: 'Form (TSB)', from: S.afterDurability.seconds, to: S.afterDurability.seconds, sub: 'reported ' + sgn(F.headline.formAdjustmentPct, 1) + '%, not applied', zero: true },
      { nm: 'Headline', from: null, to: F.headline.seconds }
    ];
    var wvals = [S.blend.seconds, S.floor.afterSeconds, S.durability.afterSeconds, F.headline.seconds];
    var wlo = Math.min.apply(null, wvals), whi = Math.max.apply(null, wvals), wsp = whi - wlo || 1; wlo -= wsp * 0.25; whi += wsp * 0.25;
    var WX = function (t) { return ((t - wlo) / (whi - wlo) * 100); };
    var wf = '<div class="wf">' + steps.map(function (s) {
      var vis;
      if (s.from == null) vis = '<span class="wpt" style="left:' + WX(s.to).toFixed(2) + '%"></span>';
      else if (s.zero) vis = '<span class="wbar zero" style="left:' + WX(s.to).toFixed(2) + '%;width:0"></span>';
      else { var a = Math.min(s.from, s.to), b = Math.max(s.from, s.to); vis = '<span class="wbar" style="left:' + WX(a).toFixed(2) + '%;width:' + Math.max(0.6, WX(b) - WX(a)).toFixed(2) + '%"></span>'; }
      var val = s.from == null ? fmtT(s.to) : (s.zero ? '0 s' : sgn(s.to - s.from, 1) + ' s');
      return '<div class="wrow"><span class="nm">' + esc(s.nm) + '</span><div class="wtrack">' + vis + '</div><span class="val">' + val + (s.sub ? '<small>' + esc(s.sub) + '</small>' : '') + '</span></div>';
    }).join('') + '</div><div class="ax"><span>' + fmtT(wlo) + '</span><span>' + fmtT(whi) + '</span></div>';
    h += stage('f6', 15, 'Adjustments', 'applyRaceFloor, applyDurabilityModifier', null,
      io([['Blended time', fmtT(S.blend.seconds)], ['Floor', fmtT(S.floor.floorSeconds) + ' from ' + r(S.floor.sourceMeters / 1000, 1) + ' km'], ['Durability shift', sgn(S.durability.timePenaltyFraction * 100, 2) + '%'], ['Form (TSB ' + r(fi.tsb, 1) + ')', sgn(F.headline.formAdjustmentPct, 1) + '%']],
        [['After floor', fmtT(S.afterFloor.seconds)], ['After durability', fmtT(S.afterDurability.seconds)], ['Headline', fmtT(F.headline.seconds), true], ['Total change', sgn(F.headline.seconds - S.blend.seconds, 1) + ' s']]) +
      '<div class="viz">' + wf + '</div>');

    // range
    var bands = [
      { nm: 'Blend', b: S.blend },
      { nm: 'After floor', b: S.afterFloor },
      { nm: 'After durability', b: S.afterDurability },
      { nm: 'Final', b: S.final }
    ];
    var rlo = Math.min(S.final.p10, F.truth.scored) - 40, rhi = Math.max(S.final.p90, F.truth.raceTimeS) + 40;
    var RX = function (t) { return ((t - rlo) / (rhi - rlo) * 100); };
    var rg = '<div class="wf">' + bands.map(function (x) {
      return '<div class="wrow"><span class="nm">' + esc(x.nm) + '</span><div class="wtrack"><span class="band" style="left:' + RX(x.b.p10).toFixed(2) + '%;width:' + (RX(x.b.p90) - RX(x.b.p10)).toFixed(2) + '%"></span><span class="wpt" style="left:' + RX(x.b.seconds).toFixed(2) + '%;width:6px;height:6px"></span></div><span class="val">' + fmtT(x.b.p10) + ' to ' + fmtT(x.b.p90) + '</span></div>';
    }).join('') + '</div><div class="ax"><span>' + fmtT(rlo) + '</span><span>p10 to p90</span><span>' + fmtT(rhi) + '</span></div>';
    h += stage('f7', 16, 'Range', 'varianceMultiplier, training specificity', null,
      io([['Band after durability', fmtT(S.afterDurability.p10) + ' to ' + fmtT(S.afterDurability.p90)], ['Variance multiplier', '×' + r(S.varianceMultiplier, 2)], ['Specificity widening', '×' + r(S.specificityWidthScale, 3)]],
        [['p10', fmtT(F.headline.p10)], ['p50', fmtT(F.headline.p50)], ['p90', fmtT(F.headline.p90)], ['Width', r(F.headline.p90 - F.headline.p10) + ' s', true]]) +
      '<div class="viz">' + rg + '</div>');

    // truth: the Lab scores against rested ability on the forecast date; race-day rows are extra context
    var T = F.truth, HL = F.headline;
    var rowsT = [
      { nm: 'Scored truth', sub: 'rested, on ' + F.evalDate, t: T.scored, c: 'var(--z-easy)', main: true },
      { nm: 'Race-day ability', sub: 'ideal conditions, with race-day fatigue', t: T.idealTimeS, c: 'var(--z-steady)' },
      { nm: 'Race result', sub: r(T.tempF) + ' °F, hill factor ' + r(T.hill, 3), t: T.raceTimeS, c: 'var(--z-interval)' }
    ];
    var tlo = Math.min(HL.p10, T.scored, T.idealTimeS) - 40, thi = Math.max(HL.p90, T.raceTimeS) + 40;
    var TXn = function (t) { return ((t - tlo) / (thi - tlo) * 100); };
    var tv = '<div class="wf">' + rowsT.map(function (x) {
      return '<div class="wrow"><span class="nm">' + esc(x.nm) + '</span><div class="wtrack"><span class="band" style="left:' + TXn(HL.p10).toFixed(2) + '%;width:' + (TXn(HL.p90) - TXn(HL.p10)).toFixed(2) + '%"></span>' +
        '<span class="mk" style="left:' + TXn(HL.seconds).toFixed(2) + '%;background:var(--t1)"></span>' +
        '<span class="wpt" style="left:' + TXn(x.t).toFixed(2) + '%;background:' + x.c + '"></span></div><span class="val">' + fmtT(x.t) + '</span></div>';
    }).join('') + '</div><div class="ax"><span>' + fmtT(tlo) + '</span><span>' + fmtT(thi) + '</span></div>' +
      '<div class="legend"><span><i style="background:var(--t1);width:2px;height:10px"></i>forecast ' + fmtT(HL.seconds) + '</span><span><i class="sq" style="background:rgba(124,108,240,.28);border:1px solid var(--acc)"></i>p10 to p90, ' + fmtT(HL.p10) + ' to ' + fmtT(HL.p90) + '</span></div>';
    var cards = rowsT.map(function (x) {
      var e = 100 * Math.log(HL.seconds / x.t);
      var inside = x.t >= HL.p10 && x.t <= HL.p90;
      var where = inside ? 'inside p10 to p90' : (x.t > HL.p90 ? 'outside, slower than p90' : 'outside, faster than p10');
      return '<div class="box"' + (x.main ? ' style="border-color:var(--acc)"' : '') + '><div class="lbl">' + esc(x.nm) + '</div><div class="big" style="color:' + x.c + '">' + fmtT(x.t) + '</div><div class="sm">' + esc(x.sub) + '</div><div class="sm" style="color:var(--t2);margin-top:4px">forecast ' + sgn(e, 1) + '% · ' + where + '</div></div>';
    }).join('');
    h += stage('f8', 17, 'Against the truth', 'Lab truth, scored on rested ability', null,
      '<div class="end">' + cards + '</div><div class="viz">' + tv + '</div>', true);
    $('fcflow').innerHTML = h;
  }

  function watchMap() {
    var links = Array.prototype.slice.call(document.querySelectorAll('#map a'));
    function upd() {
      var best = null, y = 80;
      links.forEach(function (a) { var el = $(a.getAttribute('data-id')); if (!el) return; var t = el.getBoundingClientRect().top; if (t - y <= 0) best = a; });
      links.forEach(function (a) { a.classList.toggle('on', a === best); });
    }
    window.addEventListener('scroll', upd, { passive: true });
    upd();
  }

  buildMap();
  renderPick();
  renderRun(0);
  renderForecast();
  watchMap();
})();
</script>
</body>
</html>
